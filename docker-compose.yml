services:
  emqx:
    image: emqx/emqx:5.1.0
    container_name: emqx
    restart: unless-stopped
    ports:
      - "1883:1883" # MQTT
      - "8083:8083" # WebSocket MQTT
      - "18083:18083" # Dashboard
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: admin
      EMQX_NODE__NAME: emqx@emqx
      EMQX_NODE__COOKIE: mysecretcookie
    network_mode: host

  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8087:8086"
    # environment:
    # INFLUXDB_DB: mqtt_data
    # INFLUXDB_ADMIN_USER: admin
    # INFLUXDB_ADMIN_PASSWORD: secret123
    # INFLUXDB_HTTP_AUTH_ENABLED: "true"
    volumes:
      - influxdb-data:/var/lib/influxdb
    network_mode: host

  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
    volumes:
      - mongo-data:/data/db
    network_mode: host

  fastapi:
    build:
      context: ./connector
      dockerfile: Dockerfile
    container_name: fastapi_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # MQTT Broker (no credentials needed)
      MQTT_BROKER: emqx
      MQTT_PORT: 1883

      # InfluxDB
      INFLUXDB_URL: http://localhost:8086
      INFLUXDB_USERNAME: admin
      INFLUXDB_PASSWORD: secret123
      INFLUXDB_DB: mqtt_data

      # MongoDB
      MONGO_DB: mqtt_data
      MONGO_URI: mongodb://admin:secret123@localhost:27017/?authSource=admin
    depends_on:
      - emqx
      - influxdb
      - mongo
    volumes:
      - ./fastapi_logs:/app/logs
    network_mode: host

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3500:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - loki
    # network_mode: host
    networks:
      - iot-net

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/config/loki-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/config/loki-config.yaml
    network_mode: host

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail-config.yaml:/mnt/config/promtail-config.yaml
      - /var/log:/var/log
      - ./fastapi_logs:/root/IIOT/fastapi_logs
    command: -config.file=/mnt/config/promtail-config.yaml
    depends_on:
      - loki
    network_mode: host

  dashboard:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: iiot_dashboard
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - influxdb
      - emqx
    environment:
      - BETTER_AUTH_SECRET=bd6c36aadcb8077991d99d8568fec623f591357beab87712f30716573b0d76af3055e835836e784622a3058494bb06b655f168cf8979ad23e69ea77b6a5d8db899cd59bbf330a9426999b1763cd52fc3c93e4806a097b1f1ada92a75730f8dd279e81a72e59dd64d2215066832541bdae38a43956bcaef4b4d946576bb6ae1c0
      - BETTER_AUTH_URL=http://localhost:3000
      - BASE_URL=http://localhost:3000
      - MONGODB_URI=mongodb://admin:secret123@localhost:27017/iiot?authSource=admin
      # - INFLUXDB_PASSWORD=admin
      # - INFLUXDB_USERNAME=secret123
      - INFLUX_PORT=8086
      - INFLUX_HOST=localhost
      - UTIL_SERVER_IP=localhost
      - UTIL_SERVER_PORT=8600
      - ORIGIN=http://localhost:3000
    restart: always
    network_mode: host
    networks:
      - iot-net
    # networks:
    #   - iot-net

  util:
    build:
      context: ./util
      dockerfile: Dockerfile
    container_name: iiot_util
    ports:
      - "8600:8600"
    depends_on:
      - mongo
      - emqx
      - iiot_dashboard
    environment:
      - MONGODB_URI=mongodb://admin:secret123@localhost:27017/?authSource=admin
      - MONGO_DATABASE=iiot
      - IIOT_DASHBOARD_IP=localhost
      - IIOT_DASHBOARD_PORT=3000
    restart: always
    network_mode: host
    # networks:
    #   - iot-net

volumes:
  mongo-data:
  influxdb-data:
  loki_data:
  grafana_data:

networks:
  iot-net:
